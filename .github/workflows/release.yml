name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  binaries:
    name: signed ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          targets: ${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3
      - run: cargo build --locked --release --target ${{ matrix.target }} -p orkia-cli
      - name: package and sign
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/orkia dist/orkia-${{ matrix.target }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 dist/orkia-${{ matrix.target }} > dist/orkia-${{ matrix.target }}.sha256
          else
            sha256sum dist/orkia-${{ matrix.target }} > dist/orkia-${{ matrix.target }}.sha256
          fi
          cosign sign-blob --yes --bundle dist/orkia-${{ matrix.target }}.sigstore.json dist/orkia-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: orkia-${{ matrix.target }}
          path: dist/

  release-assets:
    name: publish signed release assets
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orkia-*
          path: dist
          merge-multiple: true
      - name: create GitHub release with checksums and Sigstore bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  server-image:
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/orkia-server:${{ github.ref_name }}
      - name: sign image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/orkia-server
          TAG: ${{ github.ref_name }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$IMAGE@$digest"
