name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    name: ${{ matrix.os }} workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 scripts/test_verify_ghost_pr_thresholds.py
      - run: git diff --check
