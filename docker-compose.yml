services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orkia
      POSTGRES_PASSWORD: orkia
      POSTGRES_DB: orkia
    volumes:
      - orkia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkia -d orkia"]
      interval: 5s
      timeout: 5s
      retries: 10
  orkia:
    build: .
    ports:
      - "8787:8787"
    environment:
      ORKIA_BIND: 0.0.0.0:8787
      ORKIA_POSTGRES_URL: postgres://orkia:orkia@postgres/orkia
      ORKIA_REPOSITORIES: ${ORKIA_REPOSITORIES:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  orkia-postgres:
