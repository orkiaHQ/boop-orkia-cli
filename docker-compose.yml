services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orkia
      POSTGRES_PASSWORD: orkia
      POSTGRES_DB: orkia
    volumes:
      - orkia-postgres:/var/lib/postgresql/data
  orkia:
    build: .
    ports:
      - "8787:8787"
    environment:
      ORKIA_BIND: 0.0.0.0:8787
      ORKIA_DATABASE_URL: postgres://orkia:orkia@postgres/orkia
    depends_on:
      - postgres
volumes:
  orkia-postgres:
